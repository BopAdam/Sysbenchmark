name: sysbenchmark-integration

services:
  mariadb-test:
    image: mariadb:11.8

    environment:
      MARIADB_ROOT_PASSWORD: "sysbenchmark-integration-only"
      MARIADB_ROOT_HOST: "%"

    ports:
      - "127.0.0.1:3308:3306"

    tmpfs:
      - /var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s